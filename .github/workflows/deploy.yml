name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  build:
    needs: lint-and-type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check build output for outreach and brand constraints
        run: node scripts/check-dist.mjs
      - name: Add CNAME for custom domain
        run: echo "likwiid.com" > dist/CNAME
      # Keep the hashed JS and CSS of earlier deploys for 30 days. Google renders a page hours
      # after fetching it and open tabs load chunks late: both ask for file names an older build
      # used, and a 404 there showed Google an error screen (reported as a soft 404).
      - name: Restore assets from earlier deploys
        uses: actions/cache/restore@v4
        with:
          path: previous-assets
          key: pages-assets-${{ github.run_id }}
          restore-keys: pages-assets-
      - name: Serve earlier assets next to the new build
        run: |
          mkdir -p previous-assets
          find previous-assets -type f -mtime +30 -delete
          rsync -a --ignore-existing dist/assets/ previous-assets/
          rsync -a --ignore-existing previous-assets/ dist/assets/
          echo "dist/assets now holds $(find dist/assets -type f | wc -l) files"
      - name: Save assets for the next deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: previous-assets
          key: pages-assets-${{ github.run_id }}
      # Route HTML files (with per-route meta) and 404.html are generated by
      # scripts/prerender.mjs as part of `npm run build`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping IndexNow with the sitemap URLs
        continue-on-error: true
        run: node scripts/indexnow.mjs
