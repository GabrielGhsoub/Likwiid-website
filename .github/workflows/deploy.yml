name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  build:
    needs: lint-and-type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Add CNAME for custom domain
        run: echo "likwiid.com" > dist/CNAME
      - name: Add 404.html for SPA routing
        run: cp dist/index.html dist/404.html
      - name: Add direct site routes
        run: |
          for route in services work about contact \
            work/gcg-website \
            work/personal-fitness-tracker \
            work/padel-booking \
            work/padel-admin-portal \
            work/ai-fitness-coach \
            work/bully-ai \
            work/sems-energy-management \
            work/salsaflow; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - name: Add direct Beit Toureef routes
        run: |
          for route in beit-toureef-walkthrough beit-toureef-poc; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
