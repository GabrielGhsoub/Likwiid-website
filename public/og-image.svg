<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D0D18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0F;stop-opacity:1" />
    </linearGradient>

    <!-- Cyan accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0" />
    </linearGradient>

    <!-- Glow filter for the text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle radial glow behind text -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0" />
    </radialGradient>

    <!-- Top-left corner accent gradient -->
    <radialGradient id="cornerGlow1" cx="0%" cy="0%" r="50%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0" />
    </radialGradient>

    <!-- Bottom-right corner accent gradient -->
    <radialGradient id="cornerGlow2" cx="100%" cy="100%" r="50%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Corner accents -->
  <rect width="1200" height="630" fill="url(#cornerGlow1)" />
  <rect width="1200" height="630" fill="url(#cornerGlow2)" />

  <!-- Center glow -->
  <rect width="1200" height="630" fill="url(#centerGlow)" />

  <!-- Subtle geometric grid lines -->
  <g opacity="0.04" stroke="#22D3EE" stroke-width="0.5" fill="none">
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="0" y1="157" x2="1200" y2="157" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="473" x2="1200" y2="473" />
  </g>

  <!-- Decorative diagonal lines -->
  <g opacity="0.03" stroke="#22D3EE" stroke-width="0.5" fill="none">
    <line x1="0" y1="630" x2="400" y2="0" />
    <line x1="800" y1="630" x2="1200" y2="0" />
  </g>

  <!-- Accent line above title -->
  <rect x="500" y="230" width="200" height="1.5" fill="url(#accentGrad)" rx="1" />

  <!-- Main title: Likwiid -->
  <text x="600" y="310" text-anchor="middle" font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="88" fill="#FFFFFF" letter-spacing="4">Likwiid</text>

  <!-- Subtitle: Software Studio -->
  <text x="600" y="370" text-anchor="middle" font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="28" fill="#22D3EE" letter-spacing="8" opacity="0.9">SOFTWARE STUDIO</text>

  <!-- Accent line below subtitle -->
  <rect x="500" y="400" width="200" height="1.5" fill="url(#accentGrad)" rx="1" />

  <!-- Small decorative dots at corners of the accent lines -->
  <circle cx="500" cy="230" r="2" fill="#22D3EE" opacity="0.4" />
  <circle cx="700" cy="230" r="2" fill="#22D3EE" opacity="0.4" />
  <circle cx="500" cy="401" r="2" fill="#22D3EE" opacity="0.4" />
  <circle cx="700" cy="401" r="2" fill="#22D3EE" opacity="0.4" />

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.08" />
</svg>
